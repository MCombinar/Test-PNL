    // --- Start of components/StyledButton.tsx ---
    const StyledButton = ({ children, variant = 'primary', size = 'md', fullWidth = false, className = '', ...props }) => {
      const baseStyles = 'font-semibold rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-opacity-75 transition-all duration-150 ease-in-out transform hover:scale-105 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:scale-100';
      const variantStyles = {
        primary: 'bg-indigo-500 hover:bg-indigo-600 text-white focus:ring-indigo-400',
        secondary: 'bg-slate-600 hover:bg-slate-500 text-slate-100 focus:ring-slate-400',
        success: 'bg-emerald-500 hover:bg-emerald-600 text-white focus:ring-emerald-400',
      };
      const sizeStyles = {
        sm: 'px-3 py-1.5 text-sm',
        md: 'px-4 py-2 text-base',
        lg: 'px-6 py-3 text-lg',
      };
      const widthStyles = fullWidth ? 'w-full' : '';
      return (
        React.createElement("button", {
          className: `${baseStyles} ${variantStyles[variant]} ${sizeStyles[size]} ${widthStyles} ${className}`,
          ...props
        }, children)
      );
    };
    // --- End of components/StyledButton.tsx ---

    // --- Start of components/ProgressBar.tsx ---
    const ProgressBar = ({ current, total }) => {
      const percentage = total > 0 ? (current / total) * 100 : 0;
      return (
        React.createElement("div", { className: "w-full bg-slate-700 rounded-full h-2.5 mb-6 shadow-inner" },
          React.createElement("div", {
            className: "bg-indigo-500 h-2.5 rounded-full transition-all duration-500 ease-out",
            style: { width: `${percentage}%` }
          }))
      );
    };
    // --- End of components/ProgressBar.tsx ---

    // --- Start of components/QuestionDisplay.tsx ---
    const QuestionDisplay = ({ question, onAnswer, selectedOption }) => {
      return (
        React.createElement("div", { className: "mb-8 p-6 bg-dark-card rounded-lg shadow-lg animate-slide-in-up" },
          React.createElement("h2", { className: "text-xl font-semibold text-dark-text-primary mb-6" },
            React.createElement("span", { className: "text-indigo-400 font-bold mr-2" }, `${question.id}.`),
            question.text
          ),
          React.createElement("div", { className: "space-y-3" },
            question.options.map((option) => (
              React.createElement("button", {
                key: option.id,
                onClick: () => onAnswer(question.id, option.style),
                className: `
                  w-full text-left p-4 rounded-md border-2 
                  transition-all duration-200 ease-in-out
                  hover:shadow-md
                  focus:outline-none focus:ring-2 focus:ring-opacity-50
                  ${selectedOption === option.style 
                    ? 'bg-indigo-600 border-indigo-500 ring-2 ring-indigo-500 text-white font-semibold' 
                    : 'bg-slate-700 hover:bg-indigo-700 hover:border-indigo-500 border-dark-border text-dark-text-secondary hover:text-dark-text-primary'}
                `
              },
              React.createElement("span", { className: "font-medium mr-2" }, `${option.id.toUpperCase()})`), ` ${option.text}`)
            ))
          )
        )
      );
    };
    // --- End of components/QuestionDisplay.tsx ---

    // --- Start of components/IntroductionScreen.tsx ---
    const IntroductionScreen = ({ onStartQuiz }) => {
      return (
        React.createElement("div", { className: "bg-dark-card p-6 sm:p-8 rounded-xl shadow-2xl animate-fade-in text-center" },
          React.createElement("div", { className: "flex justify-center items-center space-x-4 mb-6" },
            React.createElement(EyeIcon, { className: "w-10 h-10 text-visual" }),
            React.createElement(EarIcon, { className: "w-10 h-10 text-auditory" }),
            React.createElement(MotionIcon, { className: "w-10 h-10 text-kinesthetic" })
          ),
          React.createElement("h1", { className: "text-3xl sm:text-4xl font-bold text-dark-text-primary mb-4" },
            "Test VAK: Descubre tu Estilo de Aprendizaje"
          ),
          React.createElement("p", { className: "text-dark-text-secondary mb-3 text-sm sm:text-base" },
            "¡Bienvenido/a! Este test te ayudará a conocer más sobre tu tipo de percepción dominante (Visual, Auditivo o Kinestésico) al momento de capturar y procesar información."
          ),
          React.createElement("p", { className: "text-dark-text-secondary mb-6 text-sm sm:text-base" },
            "El aprendizaje es un proceso activo y dinámico. Conocer tu estilo propio puede facilitar y potenciar tu aprendizaje."
          ),
          React.createElement("h2", { className: "text-xl font-semibold text-dark-text-primary mb-3" }, "Instrucciones"),
          React.createElement("p", { className: "text-dark-text-secondary mb-6 text-sm sm:text-base" },
            "Responde a las siguientes preguntas seleccionando la opción que mejor se adapte a tus preferencias. No hay respuestas correctas o incorrectas, ¡simplemente sé tú mismo/a!"
          ),
          React.createElement(StyledButton, { onClick: onStartQuiz, size: "lg", fullWidth: true },
            "Comenzar Test"
          )
        )
      );
    };
    // --- End of components/IntroductionScreen.tsx ---

    // --- Start of components/QuizScreen.tsx ---
    const QuizScreen = ({ onQuizComplete }) => {
      const [currentBlockIndex, setCurrentBlockIndex] = useState(0);
      const [answers, setAnswers] = useState([]);
      const totalBlocks = Math.ceil(ALL_QUESTIONS.length / QUESTIONS_PER_BLOCK);
      const questionsInCurrentBlock = ALL_QUESTIONS.slice(
        currentBlockIndex * QUESTIONS_PER_BLOCK,
        (currentBlockIndex + 1) * QUESTIONS_PER_BLOCK
      );
      const handleAnswer = (questionId, style) => {
        setAnswers((prevAnswers) => {
          const existingAnswerIndex = prevAnswers.findIndex(a => a.questionId === questionId);
          if (existingAnswerIndex > -1) {
            const updatedAnswers = [...prevAnswers];
            updatedAnswers[existingAnswerIndex] = { questionId, style };
            return updatedAnswers;
          }
          return [...prevAnswers, { questionId, style }];
        });
      };
      const getSelectedOptionForQuestion = (questionId) => {
        const answer = answers.find(a => a.questionId === questionId);
        return answer ? answer.style : null;
      };
      const handleNextBlock = () => {
        if (currentBlockIndex < totalBlocks - 1) {
          setCurrentBlockIndex(currentBlockIndex + 1);
        } else {
          onQuizComplete(answers);
        }
      };
      const handlePreviousBlock = () => {
        if (currentBlockIndex > 0) {
          setCurrentBlockIndex(currentBlockIndex - 1);
        }
      };
      const isCurrentBlockAnswered = () => {
        return questionsInCurrentBlock.every(q => answers.some(a => a.questionId === q.id));
      };
      useEffect(() => {
        window.scrollTo(0, 0);
      }, [currentBlockIndex]);
      return (
        React.createElement("div", { className: "bg-dark-card p-6 sm:p-8 rounded-xl shadow-2xl animate-fade-in w-full" },
          React.createElement("h1", { className: "text-2xl sm:text-3xl font-bold text-dark-text-primary mb-2 text-center" },
            "Cuestionario VAK"
          ),
          React.createElement("p", { className: "text-center text-dark-text-muted mb-6" },
            `Bloque ${currentBlockIndex + 1} de ${totalBlocks}`
          ),
          React.createElement(ProgressBar, { current: currentBlockIndex * QUESTIONS_PER_BLOCK + questionsInCurrentBlock.filter(q => answers.some(a => a.questionId === q.id)).length, total: ALL_QUESTIONS.length }),
          questionsInCurrentBlock.map((question) => (
            React.createElement(QuestionDisplay, {
              key: question.id,
              question: question,
              onAnswer: handleAnswer,
              selectedOption: getSelectedOptionForQuestion(question.id)
            })
          )),
          React.createElement("div", { className: "mt-8 flex flex-col sm:flex-row justify-between space-y-3 sm:space-y-0 sm:space-x-4" },
            React.createElement(StyledButton, {
              onClick: handlePreviousBlock,
              disabled: currentBlockIndex === 0,
              variant: "secondary",
              className: currentBlockIndex === 0 ? 'opacity-50 cursor-not-allowed' : ''
            }, "Anterior"),
            React.createElement(StyledButton, {
              onClick: handleNextBlock,
              disabled: !isCurrentBlockAnswered(),
              variant: currentBlockIndex === totalBlocks - 1 ? 'success' : 'primary',
              className: !isCurrentBlockAnswered() ? 'opacity-50 cursor-not-allowed' : ''
            }, currentBlockIndex === totalBlocks - 1 ? 'Finalizar y Ver Resultados' : 'Siguiente')
          )
        )
      );
    };
    // --- End of components/QuizScreen.tsx ---

    // --- Start of components/ResultsScreen.tsx ---
    const LEARNING_STYLE_INFO = {
      [LearningStyle.Visual]: { title: "Visual", description: "Aprendes principalmente mediante imágenes. Te fijas en las características que puedes ver e imaginar. Sueles recordar mejor la información si la ves escrita, en diagramas o gráficos. Los colores, las formas y la organización espacial son importantes para ti.", tips: [ "Utiliza mapas mentales y esquemas.", "Subraya y usa colores en tus apuntes.", "Visualiza la información en tu mente.", "Busca videos y demostraciones visuales." ], color: "text-visual", icon: EyeIcon, chartColor: "#34D399" },
      [LearningStyle.Auditory]: { title: "Auditivo", description: "Aprendes principalmente mediante sonidos. Recuerdas mejor lo que oyes y lo que dices. Las explicaciones orales, los debates y la música te ayudan a aprender. El tono de voz y las palabras clave son importantes para ti.", tips: [ "Lee en voz alta tus apuntes.", "Graba las clases o explicaciones y escúchalas.", "Participa en debates y discusiones.", "Estudia con música (si te ayuda a concentrarte)." ], color: "text-auditory", icon: EarIcon, chartColor: "#F59E0B" },
      [LearningStyle.Kinesthetic]: { title: "Kinestésico", description: "Aprendes principalmente mediante el movimiento, el tacto y la experiencia directa. Necesitas involucrarte físicamente en las actividades para comprender y recordar. Las sensaciones y emociones son clave en tu aprendizaje.", tips: [ "Aprende haciendo: realiza experimentos y proyectos.", "Utiliza material manipulable.", "Toma descansos activos y muévete mientras estudias.", "Relaciona el aprendizaje con experiencias reales." ], color: "text-kinesthetic", icon: MotionIcon, chartColor: "#EC4899" },
    };
    const ResultsScreen = ({ results, onRestartQuiz }) => {
      const totalAnswers = results.visual + results.auditory + results.kinesthetic;
      const data = [
        { name: 'Visual', porcentaje: totalAnswers > 0 ? parseFloat(((results.visual / totalAnswers) * 100).toFixed(1)) : 0, fill: LEARNING_STYLE_INFO.Visual.chartColor },
        { name: 'Auditivo', porcentaje: totalAnswers > 0 ? parseFloat(((results.auditory / totalAnswers) * 100).toFixed(1)) : 0, fill: LEARNING_STYLE_INFO.Auditory.chartColor },
        { name: 'Kinestésico', porcentaje: totalAnswers > 0 ? parseFloat(((results.kinesthetic / totalAnswers) * 100).toFixed(1)) : 0, fill: LEARNING_STYLE_INFO.Kinesthetic.chartColor },
      ];
      const sortedResults = data.sort((a, b) => b.porcentaje - a.porcentaje);
      const dominantStyleKey = sortedResults[0].name === 'Visual' ? LearningStyle.Visual : sortedResults[0].name === 'Auditivo' ? LearningStyle.Auditory : LearningStyle.Kinesthetic;
      const dominantStyleInfo = LEARNING_STYLE_INFO[dominantStyleKey];
      return (
        React.createElement("div", { className: "bg-dark-card p-6 sm:p-8 rounded-xl shadow-2xl animate-fade-in" },
          React.createElement("h1", { className: "text-3xl sm:text-4xl font-bold text-dark-text-primary mb-6 text-center" }, "Tus Resultados VAK"),
          React.createElement("div", { className: "mb-8 h-64 sm:h-80 w-full" },
            React.createElement(ResponsiveContainer, { width: "100%", height: "100%" },
              React.createElement(BarChart, { data: data, margin: { top: 5, right: 0, left: -25, bottom: 5 } },
                React.createElement(CartesianGrid, { strokeDasharray: "3 3", stroke: "#334155" }),
                React.createElement(XAxis, { dataKey: "name", tick: { fill: '#94A3B8', fontSize: 12 } }),
                React.createElement(YAxis, { unit: "%", tick: { fill: '#94A3B8', fontSize: 12 }, domain: [0, 100] }),
                React.createElement(Tooltip, {
                  formatter: (value) => `${value}%`,
                  cursor: {fill: 'rgba(71, 85, 105, 0.4)'},
                  contentStyle: { backgroundColor: '#1E293B', borderRadius: '0.5rem', borderColor: '#334155', color: '#F1F5F9' }
                }),
                React.createElement(Legend, { wrapperStyle: { fontSize: '14px', paddingTop: '10px', color: '#CBD5E1' } }),
                React.createElement(Bar, { dataKey: "porcentaje", barSize: 40 },
                  data.map((entry, index) => (
                    React.createElement(Cell, { key: `cell-${index}`, fill: entry.fill })
                  ))
                )
              )
            )
          ),
          React.createElement("div", { className: "mb-8 text-center" },
            React.createElement("h2", { className: `text-2xl font-semibold ${dominantStyleInfo.color} mb-2` },
              `Tu estilo predominante es ${dominantStyleInfo.title}`
            ),
            React.createElement("p", { className: "text-dark-text-secondary" },
              "Esto sugiere una preferencia por aprender a través de este canal, ¡pero recuerda que todos usamos una combinación de estilos!"
            )
          ),
          React.createElement("div", { className: "space-y-6 mb-8" },
            (Object.keys(LEARNING_STYLE_INFO)).map((styleKey) => {
              const info = LEARNING_STYLE_INFO[styleKey];
              const Icon = info.icon;
              const percentage = data.find(d => d.name === info.title)?.porcentaje || 0;
              return (
                React.createElement("div", { key: styleKey, className: "p-4 border border-dark-border rounded-lg shadow-sm hover:shadow-md transition-shadow bg-slate-700/30" },
                  React.createElement("div", { className: "flex items-center mb-3" },
                    React.createElement(Icon, { className: `w-8 h-8 mr-3 ${info.color}` }),
                    React.createElement("h3", { className: `text-xl font-semibold ${info.color}` }, `${info.title} (${percentage}%)`)
                  ),
                  React.createElement("p", { className: "text-dark-text-secondary text-sm mb-2" }, info.description),
                  React.createElement("p", { className: "text-dark-text-primary font-medium text-sm mb-1" }, "Consejos para potenciar tu aprendizaje:"),
                  React.createElement("ul", { className: "list-disc list-inside text-dark-text-secondary text-sm space-y-1" },
                    info.tips.map((tip, index) => React.createElement("li", { key: index }, tip))
                  )
                )
              );
            })
          ),
          React.createElement("div", { className: "text-center space-y-4" },
            React.createElement("p", { className: "text-dark-text-secondary text-sm" },
              "¡Esperamos que este test te haya sido útil! Conocer tu estilo de aprendizaje es el primer paso para estudiar de forma más efectiva y disfrutar más del proceso."
            ),
            React.createElement(StyledButton, { onClick: onRestartQuiz, size: "lg", variant: "primary", fullWidth: true },
              "Volver a Comenzar el Test"
            ),
            React.createElement(StyledButton, { 
                onClick: () => alert("¡Comparte tus resultados con amigos!\nPuedes tomar una captura de pantalla o contarles sobre tu estilo de aprendizaje VAK."),
                variant: "secondary",
                size: "md",
                fullWidth: true
              },
              "Compartir Resultados (simulado)"
            )
          )
        )
      );
    };
    // --- End of components/ResultsScreen.tsx ---

    // --- Start of App.tsx ---
    const App = () => {
      const [currentScreen, setCurrentScreen] = useState(AppScreen.Introduction);
      const [quizResults, setQuizResults] = useState(null);
      const handleStartQuiz = useCallback(() => {
        setCurrentScreen(AppScreen.Quiz);
        setQuizResults(null);
      }, []);
      const handleQuizComplete = useCallback((answers) => {
        if (answers.length < ALL_QUESTIONS.length) {
            alert("Por favor completa todas las preguntas antes de ver los resultados.");
            return;
        }
        const results = {
          visual: 0,
          auditory: 0,
          kinesthetic: 0,
        };
        answers.forEach(answer => {
          if (answer.style === LearningStyle.Visual) results.visual++;
          else if (answer.style === LearningStyle.Auditory) results.auditory++;
          else if (answer.style === LearningStyle.Kinesthetic) results.kinesthetic++;
        });
        setQuizResults(results);
        setCurrentScreen(AppScreen.Results);
      }, []);
      const handleRestartQuiz = useCallback(() => {
        setCurrentScreen(AppScreen.Introduction);
        setQuizResults(null);
      }, []);
      const renderScreen = () => {
        switch (currentScreen) {
          case AppScreen.Introduction:
            return React.createElement(IntroductionScreen, { onStartQuiz: handleStartQuiz });
          case AppScreen.Quiz:
            return React.createElement(QuizScreen, { onQuizComplete: handleQuizComplete });
          case AppScreen.Results:
            return quizResults ? React.createElement(ResultsScreen, { results: quizResults, onRestartQuiz: handleRestartQuiz }) : React.createElement(IntroductionScreen, { onStartQuiz: handleStartQuiz });
          default:
            return React.createElement(IntroductionScreen, { onStartQuiz: handleStartQuiz });
        }
      };
      return (
        React.createElement("div", { className: "container mx-auto py-8" },
          renderScreen(),
          React.createElement("footer", { className: "text-center text-xs text-dark-text-muted mt-10" },
            React.createElement("p", null, "Test VAK Interactivo. Basado en el modelo de Programación Neurolingüística."),
            React.createElement("p", null, "Material Psicoeducativo para fines didácticos y de aprendizaje.")
          )
        )
      );
    };
    // --- End of App.tsx ---

    // --- Start of index.tsx (ReactDOM rendering part) ---
    const rootElement = document.getElementById('root');
    if (!rootElement) {
      throw new Error("Could not find root element to mount to");
    }
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      React.createElement(React.StrictMode, null, React.createElement(App, null))
    );
    // --- End of index.tsx ---
  </script>
</body>
</html>
